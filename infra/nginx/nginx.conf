# Single public origin:
#   /            -> Next.js (demo site + dashboard + its /api/* backend-for-frontend)
#   /v1/*        -> NestJS API (widget chat + admin API)
#   /widget.js   -> NestJS (embeddable widget bundle)
#   /docs        -> Swagger UI
# Terminate TLS in front of this (Cloudflare, a load balancer, or certbot --nginx).

upstream api { server api:4000; keepalive 32; }
upstream web { server web:3000; keepalive 16; }

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Chat replies stream as Server-Sent Events: never buffer them.
  location ~ ^/v1/chat/sessions/[^/]+/messages$ {
    proxy_pass http://api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    add_header X-Accel-Buffering no;
  }

  location /v1/ { proxy_pass http://api; }
  location = /health { proxy_pass http://api; }
  location /docs { proxy_pass http://api; }

  location = /widget.js {
    proxy_pass http://api;
    expires 5m;
  }

  location / { proxy_pass http://web; }
}
