name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smilecare
          POSTGRES_PASSWORD: smilecare
          POSTGRES_DB: smilecare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smilecare" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://smilecare:smilecare@localhost:5432/smilecare
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-at-least-16-chars
      EMBEDDING_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smilecare/shared build
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm --filter @smilecare/api test
      - name: Migrate database
        run: pnpm --filter @smilecare/api db:migrate
      - name: End-to-end tests (API + Postgres/pgvector + Redis, Claude faked)
        run: pnpm --filter @smilecare/api test:e2e
      - name: Build all apps
        run: pnpm build
